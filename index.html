<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatabot</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #212121;
      --sidebar: #171717;
      --panel: #2f2f2f;
      --hover: #2a2a2a;
      --border: #3a3a3a;
      --text: #fff;
      --muted: #9b9b9b;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button {
      font-family: inherit;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      padding: 12px;
      flex-shrink: 0;
      border-right: 1px solid #242424;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 9px 18px;
      font-size: 20px;
      font-weight: 700;
    }

    .brand-icon,
    .welcome-logo {
      background: #fff;
      color: #171717;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid #3b3b3b;
      background: transparent;
      color: white;
      padding: 12px 13px;
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      margin-bottom: 22px;
      transition: .15s;
    }

    .new-chat:hover {
      background: var(--hover);
    }

    .history-title {
      font-size: 12px;
      color: #777;
      padding: 0 10px 9px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .history-item {
      padding: 10px 11px;
      border-radius: 8px;
      color: #d2d2d2;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--hover);
    }

    .empty-history {
      color: #666;
      font-size: 13px;
      padding: 10px;
    }

    .profile {
      border-top: 1px solid #303030;
      padding: 12px 5px 3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3b3b3b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-plan {
      color: #777;
      font-size: 11px;
      margin-top: 3px;
    }

    .profile-button {
      border: none;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      font-size: 18px;
      padding: 5px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .topbar {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid #303030;
      background: var(--bg);
      flex-shrink: 0;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .model-name {
      font-size: 15px;
      font-weight: 600;
    }

    .model-badge {
      font-size: 10px;
      color: #aaa;
      border: 1px solid #444;
      padding: 3px 7px;
      border-radius: 6px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-button {
      border: 1px solid #3a3a3a;
      background: transparent;
      color: #ddd;
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .top-button:hover {
      background: var(--hover);
    }

    .menu-button {
      display: none;
      border: none;
      background: transparent;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 155px;
      scroll-behavior: smooth;
    }

    .messages {
      max-width: 850px;
      margin: 0 auto;
    }

    .welcome {
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome-logo {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      font-size: 28px;
      margin-bottom: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 10px;
      letter-spacing: -.5px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 15px;
    }

    .message {
      display: flex;
      gap: 14px;
      margin: 26px 0;
      line-height: 1.65;
      font-size: 15px;
    }

    .message-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .user-avatar {
      background: #555;
    }

    .bot-avatar {
      background: #fff;
      color: #171717;
    }

    .message-content {
      flex: 1;
      padding-top: 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .input-wrapper {
      position: fixed;
      bottom: 0;
      left: 270px;
      right: 0;
      padding: 20px 20px 18px;
      background: linear-gradient(transparent, var(--bg) 32%);
      z-index: 10;
    }

    .input-box {
      max-width: 850px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid #454545;
      border-radius: 17px;
      display: flex;
      align-items: flex-end;
      padding: 9px;
      box-shadow: 0 8px 35px rgba(0,0,0,.25);
    }

    .attach-button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      font-size: 20px;
      flex-shrink: 0;
    }

    .attach-button:hover {
      background: #3a3a3a;
      color: white;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      max-height: 150px;
      min-height: 24px;
      padding: 7px 8px;
    }

    textarea::placeholder {
      color: #8e8e8e;
    }

    .send-button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #171717;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .send-button:hover {
      opacity: .85;
    }

    .send-button:disabled {
      opacity: .35;
      cursor: default;
    }

    .disclaimer {
      text-align: center;
      color: #777;
      font-size: 11px;
      margin-top: 8px;
    }

    #fileInput {
      display: none;
    }

    .upload-preview {
      max-width: 850px;
      margin: 0 auto 7px;
      display: none;
      background: #2b2b2b;
      border: 1px solid #414141;
      border-radius: 10px;
      padding: 8px 10px;
      color: #bbb;
      font-size: 12px;
    }

    /* AUTH MODAL */

    .auth-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.68);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-overlay.show {
      display: flex;
    }

    .auth-box {
      width: 100%;
      max-width: 390px;
      background: #202020;
      border: 1px solid #3c3c3c;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      position: relative;
    }

    .auth-close {
      position: absolute;
      top: 12px;
      right: 14px;
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
    }

    .auth-box h2 {
      margin-bottom: 7px;
      font-size: 23px;
    }

    .auth-subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .auth-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 11px;
      border: 1px solid #414141;
      border-radius: 9px;
      background: #2b2b2b;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .auth-input:focus {
      border-color: #666;
    }

    .auth-submit {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 12px;
      background: white;
      color: #171717;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .auth-submit:disabled {
      opacity: .5;
      cursor: default;
    }

    .auth-switch {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 16px;
    }

    .auth-switch button {
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
      text-decoration: underline;
    }

    .auth-message {
      display: none;
      margin-bottom: 12px;
      padding: 9px;
      border-radius: 8px;
      background: #302020;
      color: #ffb4b4;
      font-size: 12px;
      line-height: 1.4;
    }

    .auth-message.show {
      display: block;
    }

    .logout-button {
      display: none;
      border: 1px solid #3a3a3a;
      background: transparent;
      color: #ddd;
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .logout-button:hover {
      background: var(--hover);
    }

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;
        left: -270px;
        top: 0;
        bottom: 0;
        transition: left .25s ease;
      }

      .sidebar.open {
        left: 0;
      }

      .overlay.show {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.55);
        z-index: 15;
      }

      .menu-button {
        display: block;
      }

      .topbar {
        padding: 0 14px;
      }

      .top-right .top-button {
        display: none;
      }

      .input-wrapper {
        left: 0;
        padding: 12px;
      }

      .chat-area {
        padding-left: 12px;
        padding-right: 12px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .model-badge {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- AUTH MODAL -->
    <div class="auth-overlay" id="authOverlay">

      <div class="auth-box">

        <button class="auth-close" onclick="closeAuth()">×</button>

        <h2 id="authTitle">Log in</h2>

        <div class="auth-subtitle" id="authSubtitle">
          Log in to your Chatabot account.
        </div>

        <div class="auth-message" id="authMessage"></div>

        <input
          class="auth-input"
          id="authName"
          type="text"
          placeholder="Full name"
          style="display:none;"
        >

        <input
          class="auth-input"
          id="authEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          class="auth-input"
          id="authPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button
          class="auth-submit"
          id="authSubmit"
          onclick="submitAuth()"
        >
          Log in
        </button>

        <div class="auth-switch">
          <span id="authSwitchText">Don't have an account?</span>

          <button onclick="switchAuthMode()" id="authSwitchButton">
            Sign up
          </button>
        </div>

      </div>

    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="brand-icon">C</div>
        <span>Chatabot</span>
      </div>

      <button class="new-chat" onclick="newChat()">
        ＋ New chat
      </button>

      <div class="history-title">Recent chats</div>

      <div class="history" id="history">
        <div class="empty-history">No chats yet</div>
      </div>

      <div class="profile">

        <div class="avatar" id="profileAvatar">U</div>

        <div class="profile-info">
          <div class="profile-name" id="profileName">Guest</div>
          <div class="profile-plan" id="profilePlan">Free plan</div>
        </div>

        <button class="profile-button" onclick="profileAction()">⋯</button>

      </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <header class="topbar">

        <div class="top-left">

          <button
            class="menu-button"
            onclick="toggleSidebar()"
          >
            ☰
          </button>

          <div class="model-name">Chatabot</div>

          <div class="model-badge">AI</div>

        </div>

        <div class="top-right">

          <button
            class="top-button"
            id="loginButton"
            onclick="loginPrompt()"
          >
            Log in
          </button>

          <button
            class="top-button"
            id="signupButton"
            onclick="signupPrompt()"
          >
            Sign up
          </button>

          <button
            class="logout-button"
            id="logoutButton"
            onclick="logoutUser()"
          >
            Log out
          </button>

        </div>

      </header>

      <section class="chat-area" id="chatArea">

        <div class="messages" id="messages">

          <div class="welcome" id="welcome">

            <div class="welcome-logo">C</div>

            <h1>How can I help you?</h1>

            <p>Ask Chatabot anything.</p>

          </div>

        </div>

      </section>

      <!-- INPUT -->
      <div class="input-wrapper">

        <div class="upload-preview" id="uploadPreview"></div>

        <div class="input-box">

          <input
            type="file"
            id="fileInput"
            accept="image/*"
            onchange="handleImageUpload(event)"
          >

          <button
            class="attach-button"
            onclick="document.getElementById('fileInput').click()"
            title="Upload image"
          >
            ＋
          </button>

          <textarea
            id="userInput"
            placeholder="Message Chatabot..."
            rows="1"
            oninput="resizeTextarea()"
            onkeydown="handleKey(event)"
          ></textarea>

          <button
            class="send-button"
            id="sendButton"
            onclick="sendMessage()"
          >
            ↑
          </button>

        </div>

        <div class="disclaimer">
          Chatabot can make mistakes. Check important information.
        </div>

      </div>

    </main>

  </div>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://djdiurxlkyycbodqmwpf.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       ELEMENTS
    ========================= */

    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");
    const history = document.getElementById("history");
    const chatArea = document.getElementById("chatArea");
    const uploadPreview = document.getElementById("uploadPreview");

    const authOverlay = document.getElementById("authOverlay");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const authName = document.getElementById("authName");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const authSubmit = document.getElementById("authSubmit");
    const authMessage = document.getElementById("authMessage");
    const authSwitchText = document.getElementById("authSwitchText");
    const authSwitchButton = document.getElementById("authSwitchButton");

    const profileName = document.getElementById("profileName");
    const profilePlan = document.getElementById("profilePlan");
    const profileAvatar = document.getElementById("profileAvatar");

    const loginButton = document.getElementById("loginButton");
    const signupButton = document.getElementById("signupButton");
    const logoutButton = document.getElementById("logoutButton");


    /* =========================
       CHAT DATA
    ========================= */

    let currentChat = [];
    let chats =
      JSON.parse(
        localStorage.getItem("chatabot_history") || "[]"
      );

    let selectedChat = null;


    /* =========================
       AUTH DATA
    ========================= */

    let authMode = "login";
    let currentUser = null;


    renderHistory();
    checkAuth();


    /* =========================
       AUTH CHECK
    ========================= */

    async function checkAuth() {

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();

      if (session && session.user) {

        currentUser = session.user;

        await loadUserProfile();

      } else {

        currentUser = null;

        updateGuestUI();

      }

    }


    /* =========================
       AUTH STATE LISTENER
    ========================= */

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (session && session.user) {

          currentUser = session.user;

          await loadUserProfile();

        } else {

          currentUser = null;

          updateGuestUI();

        }

      }
    );


    /* =========================
       LOAD PROFILE
    ========================= */

    async function loadUserProfile() {

      if (!currentUser) return;

      const {
        data,
        error
      } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (error) {

        console.error(
          "Profile load error:",
          error
        );

        updateUserUI(
          currentUser.user_metadata?.full_name ||
          currentUser.email ||
          "User",
          "Free plan"
        );

        return;
      }

      if (data) {

        updateUserUI(
          data.full_name ||
          currentUser.email ||
          "User",
          data.plan || "free"
        );

      } else {

        await createUserProfile();

      }

    }


    /* =========================
       CREATE PROFILE
    ========================= */

    async function createUserProfile() {

      if (!currentUser) return;

      const fullName =
        currentUser.user_metadata?.full_name ||
        currentUser.email?.split("@")[0] ||
        "User";

      const {
        error
      } = await supabaseClient
        .from("profiles")
        .insert({
          user_id: currentUser.id,
          email: currentUser.email,
          full_name: fullName,
          plan: "free"
        });

      if (error) {

        console.error(
          "Profile creation error:",
          error
        );

        updateUserUI(
          fullName,
          "Free plan"
        );

        return;
      }

      updateUserUI(
        fullName,
        "Free plan"
      );

    }


    /* =========================
       UPDATE USER UI
    ========================= */

    function updateUserUI(name, plan) {

      profileName.textContent = name;

      profilePlan.textContent =
        plan === "free"
          ? "Free plan"
          : plan;

      profileAvatar.textContent =
        name.charAt(0).toUpperCase();

      loginButton.style.display = "none";
      signupButton.style.display = "none";
      logoutButton.style.display = "block";

    }


    /* =========================
       GUEST UI
    ========================= */

    function updateGuestUI() {

      profileName.textContent = "Guest";
      profilePlan.textContent = "Free plan";
      profileAvatar.textContent = "U";

      loginButton.style.display = "block";
      signupButton.style.display = "block";
      logoutButton.style.display = "none";

    }


    /* =========================
       OPEN LOGIN
    ========================= */

    function loginPrompt() {

      authMode = "login";

      authTitle.textContent = "Log in";

      authSubtitle.textContent =
        "Log in to your Chatabot account.";

      authName.style.display = "none";

      authSubmit.textContent = "Log in";

      authSwitchText.textContent =
        "Don't have an account?";

      authSwitchButton.textContent =
        "Sign up";

      clearAuthMessage();

      authEmail.value = "";
      authPassword.value = "";

      authOverlay.classList.add("show");

    }


    /* =========================
       OPEN SIGNUP
    ========================= */

    function signupPrompt() {

      authMode = "signup";

      authTitle.textContent = "Create account";

      authSubtitle.textContent =
        "Create your free Chatabot account.";

      authName.style.display = "block";

      authSubmit.textContent = "Sign up";

      authSwitchText.textContent =
        "Already have an account?";

      authSwitchButton.textContent =
        "Log in";

      clearAuthMessage();

      authName.value = "";
      authEmail.value = "";
      authPassword.value = "";

      authOverlay.classList.add("show");

    }


    /* =========================
       SWITCH AUTH MODE
    ========================= */

    function switchAuthMode() {

      if (authMode === "login") {

        signupPrompt();

      } else {

        loginPrompt();

      }

    }


    /* =========================
       CLOSE AUTH
    ========================= */

    function closeAuth() {

      authOverlay.classList.remove("show");

      clearAuthMessage();

    }


    /* =========================
       AUTH MESSAGE
    ========================= */

    function showAuthMessage(message) {

      authMessage.textContent = message;

      authMessage.classList.add("show");

    }


    function clearAuthMessage() {

      authMessage.textContent = "";

      authMessage.classList.remove("show");

    }


    /* =========================
       SUBMIT AUTH
    ========================= */

    async function submitAuth() {

      clearAuthMessage();

      const email =
        authEmail.value.trim();

      const password =
        authPassword.value;

      if (!email || !password) {

        showAuthMessage(
          "Please enter your email and password."
        );

        return;

      }

      if (authMode === "signup") {

        const fullName =
          authName.value.trim();

        if (!fullName) {

          showAuthMessage(
            "Please enter your full name."
          );

          return;

        }

        if (password.length < 6) {

          showAuthMessage(
            "Password must be at least 6 characters."
          );

          return;

        }

        authSubmit.disabled = true;
        authSubmit.textContent = "Creating...";

        const {
          data,
          error
        } = await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {
            data: {
              full_name: fullName
            }
          }

        });

        authSubmit.disabled = false;
        authSubmit.textContent = "Sign up";

        if (error) {

          showAuthMessage(error.message);

          return;

        }

        if (data.user && !data.session) {

          showAuthMessage(
            "Account created. Please check your email to confirm your account."
          );

          return;

        }

        if (data.session) {

          currentUser = data.user;

          await createUserProfile();

          closeAuth();

        }

        return;

      }


      /* LOGIN */

      authSubmit.disabled = true;
      authSubmit.textContent = "Logging in...";

      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });

      authSubmit.disabled = false;
      authSubmit.textContent = "Log in";

      if (error) {

        showAuthMessage(error.message);

        return;

      }

      if (data.user) {

        currentUser = data.user;

        await loadUserProfile();

        closeAuth();

      }

    }


    /* =========================
       LOGOUT
    ========================= */

    async function logoutUser() {

      const {
        error
      } = await supabaseClient.auth.signOut();

      if (error) {

        alert(error.message);

        return;

      }

      currentUser = null;

      updateGuestUI();

    }


    /* =========================
       PROFILE BUTTON
    ========================= */

    function profileAction() {

      if (currentUser) {

        logoutUser();

      } else {

        loginPrompt();

      }

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    function sendMessage() {

      const text =
        input.value.trim();

      if (!text) return;

      removeWelcome();

      addMessage(
        text,
        "user"
      );

      currentChat.push({
        role: "user",
        content: text
      });

      input.value = "";

      resizeTextarea();

      saveCurrentChat();

      setTimeout(() => {

        const reply =
          "Hello! I'm Chatabot. 🤖\n\n" +
          "Your message was received successfully.\n\n" +
          "The AI backend will be connected in the next step.";

        addMessage(
          reply,
          "bot"
        );

        currentChat.push({
          role: "bot",
          content: reply
        });

        saveCurrentChat();

      }, 500);

    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message";

      const avatar =
        document.createElement("div");

      avatar.className =
        "message-avatar " +
        (type === "user"
          ? "user-avatar"
          : "bot-avatar");

      avatar.textContent =
        type === "user"
          ? "U"
          : "C";

      const content =
        document.createElement("div");

      content.className =
        "message-content";

      content.textContent =
        text;

      message.appendChild(
        avatar
      );

      message.appendChild(
        content
      );

      messages.appendChild(
        message
      );

      chatArea.scrollTop =
        chatArea.scrollHeight;

    }


    /* =========================
       NEW CHAT
    ========================= */

    function newChat() {

      if (currentChat.length > 0) {

        saveCurrentChat();

      }

      currentChat = [];

      selectedChat = null;

      showWelcome();

      input.value = "";

      resizeTextarea();

      uploadPreview.style.display =
        "none";

      uploadPreview.textContent =
        "";

      document.getElementById(
        "fileInput"
      ).value = "";

      closeMobileSidebar();

      renderHistory();

    }


    /* =========================
       SAVE CHAT
    ========================= */

    function saveCurrentChat() {

      if (!currentChat.length) return;

      const firstUserMessage =
        currentChat.find(
          m => m.role === "user"
        );

      const title =
        firstUserMessage
          ? firstUserMessage.content.substring(
              0,
              45
            )
          : "New chat";

      if (selectedChat !== null) {

        chats[selectedChat] = {
          title: title,
          messages: currentChat
        };

      } else {

        chats.unshift({
          title: title,
          messages: currentChat
        });

        selectedChat = 0;

      }

      localStorage.setItem(
        "chatabot_history",
        JSON.stringify(chats)
      );

      renderHistory();

    }


    /* =========================
       HISTORY
    ========================= */

    function renderHistory() {

      history.innerHTML = "";

      if (!chats.length) {

        history.innerHTML =
          '<div class="empty-history">No chats yet</div>';

        return;

      }

      chats.forEach(
        (chat, index) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "history-item " +
            (
              index === selectedChat
                ? "active"
                : ""
            );

          item.textContent =
            chat.title ||
            "New chat";

          item.onclick =
            () => loadChat(index);

          history.appendChild(
            item
          );

        }
      );

    }


    /* =========================
       LOAD CHAT
    ========================= */

    function loadChat(index) {

      const chat =
        chats[index];

      if (!chat) return;

      selectedChat =
        index;

      currentChat =
        [...chat.messages];

      messages.innerHTML =
        "";

      currentChat.forEach(
        message => {

          addMessage(
            message.content,
            message.role === "user"
              ? "user"
              : "bot"
          );

        }
      );

      renderHistory();

      closeMobileSidebar();

    }


    /* =========================
       WELCOME
    ========================= */

    function removeWelcome() {

      const welcome =
        document.getElementById(
          "welcome"
        );

      if (welcome) {

        welcome.remove();

      }

    }


    function showWelcome() {

      messages.innerHTML =
        "";

      const welcome =
        document.createElement(
          "div"
        );

      welcome.className =
        "welcome";

      welcome.id =
        "welcome";

      welcome.innerHTML = `
        <div class="welcome-logo">C</div>
        <h1>How can I help you?</h1>
        <p>Ask Chatabot anything.</p>
      `;

      messages.appendChild(
        welcome
      );

    }


    /* =========================
       ENTER TO SEND
    ========================= */

    function handleKey(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =========================
       TEXTAREA RESIZE
    ========================= */

    function resizeTextarea() {

      input.style.height =
        "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          150
        ) + "px";

    }


    /* =========================
       IMAGE UPLOAD UI
    ========================= */

    function handleImageUpload(event) {

      const file =
        event.target.files[0];

      if (!file) return;

      uploadPreview.style.display =
        "block";

      uploadPreview.textContent =
        "📎 " +
        file.name +
        " selected";

    }


    /* =========================
       MOBILE SIDEBAR
    ========================= */

    function toggleSidebar() {

      document
        .getElementById("sidebar")
        .classList.toggle("open");

      document
        .getElementById("overlay")
        .classList.toggle("show");

    }


    function closeMobileSidebar() {

      document
        .getElementById("sidebar")
        .classList.remove("open");

      document
        .getElementById("overlay")
        .classList.remove("show");

    }

  </script>

</body>
</html>
