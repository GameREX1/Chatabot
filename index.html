<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatabot</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #000000;
      --sidebar: #050505;
      --panel: #0d0d0d;
      --panel-hover: #171717;
      --border: #262626;
      --border-light: #303030;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --soft: #707070;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: #000;
      color: var(--text);
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      background: #000;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 260px;
      background: #050505;
      display: flex;
      flex-direction: column;
      padding: 10px;
      flex-shrink: 0;
      border-right: 1px solid #181818;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 9px 18px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -.4px;
      color: #f5f5f5;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .new-chat {
      width: 100%;
      border: 1px solid #292929;
      background: #080808;
      color: #eee;
      padding: 13px 14px;
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
      font-size: 15px;
      margin-bottom: 23px;
      transition: background .15s ease, border-color .15s ease;
    }

    .new-chat:hover {
      background: #151515;
      border-color: #353535;
    }

    .history-title {
      font-size: 12px;
      color: #696969;
      padding: 0 10px 9px;
      text-transform: uppercase;
      letter-spacing: .5px;
      font-weight: 600;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .history::-webkit-scrollbar,
    .chat-area::-webkit-scrollbar {
      width: 6px;
    }

    .history::-webkit-scrollbar-thumb,
    .chat-area::-webkit-scrollbar-thumb {
      background: #292929;
      border-radius: 20px;
    }

    .history-item {
      padding: 11px 12px;
      border-radius: 8px;
      color: #d0d0d0;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .history-item:hover,
    .history-item.active {
      background: #151515;
    }

    .empty-history {
      color: #555;
      font-size: 14px;
      padding: 10px;
    }

    .profile {
      border-top: 1px solid #1b1b1b;
      padding: 12px 5px 3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 37px;
      height: 37px;
      border-radius: 50%;
      background: #242424;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-plan {
      color: #666;
      font-size: 12px;
      margin-top: 3px;
    }

    .profile-button {
      border: none;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 19px;
      padding: 5px;
    }

    .profile-button:hover {
      color: white;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      background: #000;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid #181818;
      background: #000;
      flex-shrink: 0;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .model-name {
      font-size: 17px;
      font-weight: 600;
      color: #f2f2f2;
    }

    .model-badge {
      font-size: 11px;
      color: #8d8d8d;
      border: 1px solid #292929;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-button,
    .logout-button {
      border: 1px solid #292929;
      background: #050505;
      color: #ddd;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background .15s ease, border-color .15s ease;
    }

    .top-button:hover,
    .logout-button:hover {
      background: #151515;
      border-color: #3a3a3a;
    }

    .menu-button {
      display: none;
      border: none;
      background: transparent;
      color: #eee;
      font-size: 23px;
      cursor: pointer;
    }

    /* =========================
       CHAT
    ========================= */

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 25px 25px 165px;
      scroll-behavior: smooth;
      background: #000;
    }

    .messages {
      max-width: 900px;
      margin: 0 auto;
    }

    .welcome {
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome-logo {
      width: 78px;
      height: 78px;
      border-radius: 19px;
      object-fit: cover;
      margin-bottom: 24px;
      box-shadow: 0 10px 45px rgba(0,0,0,.8);
    }

    .welcome h1 {
      font-size: 36px;
      font-weight: 600;
      margin-bottom: 11px;
      letter-spacing: -.8px;
      color: #f5f5f5;
    }

    .welcome p {
      color: #858585;
      font-size: 17px;
    }

    /* =========================
       MESSAGES
    ========================= */

    .message {
      display: flex;
      width: 100%;
      gap: 12px;
      margin: 26px 0;
      line-height: 1.65;
      font-size: 17px;
      animation: messageIn .15s ease;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.user .message-content {
      order: 1;
      flex: 0 1 auto;
      max-width: 76%;
      background: #1b1b1b;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 12px 16px;
      color: #f5f5f5;
    }

    .message.user .message-avatar {
      order: 2;
    }

    .message.bot {
      justify-content: flex-start;
    }

    .message.bot .message-avatar {
      order: 1;
    }

    .message.bot .message-content {
      order: 2;
      flex: 0 1 auto;
      max-width: 78%;
      padding: 4px 0;
      color: #eeeeee;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      margin-top: 2px;
    }

    .user-avatar {
      background: #303030;
      color: white;
    }

    .bot-avatar {
      background: #111;
      color: white;
      border: 1px solid #272727;
    }

    .bot-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message-content {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .generated-image {
      display: block;
      width: min(100%, 700px);
      max-width: 100%;
      border-radius: 14px;
      border: 1px solid #292929;
      margin-top: 4px;
      box-shadow: 0 12px 45px rgba(0,0,0,.45);
    }

    .image-label {
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    /* =========================
       TYPING
    ========================= */

    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      height: 27px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #999;
      animation: typing .9s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: .3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================
       INPUT
    ========================= */

    .input-wrapper {
      position: fixed;
      bottom: 0;
      left: 260px;
      right: 0;
      padding: 20px 20px 18px;
      background: linear-gradient(
        transparent,
        #000 30%
      );
      z-index: 10;
    }

    .input-box {
      max-width: 900px;
      margin: 0 auto;
      background: #080808;
      border: 1px solid #292929;
      border-radius: 18px;
      display: flex;
      align-items: flex-end;
      padding: 9px;
      box-shadow: 0 8px 40px rgba(0,0,0,.75);
      transition: border-color .15s ease;
    }

    .input-box:focus-within {
      border-color: #3a3a3a;
    }

    .attach-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #8d8d8d;
      cursor: pointer;
      font-size: 23px;
      flex-shrink: 0;
      transition: background .15s ease, color .15s ease;
    }

    .attach-button:hover {
      background: #181818;
      color: white;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 17px;
      line-height: 1.5;
      max-height: 150px;
      min-height: 28px;
      padding: 7px 10px;
    }

    textarea::placeholder {
      color: #777;
    }

    .send-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #f5f5f5;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition:
        transform .12s ease,
        opacity .12s ease,
        background .12s ease;
    }

    .send-button svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2.3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .send-button:hover {
      transform: scale(1.04);
      background: white;
    }

    .send-button:active {
      transform: scale(.96);
    }

    .send-button:disabled {
      opacity: .35;
      cursor: default;
      transform: none;
    }

    .disclaimer {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 8px;
    }

    #fileInput {
      display: none;
    }

    .upload-preview {
      max-width: 900px;
      margin: 0 auto 7px;
      display: none;
      background: #0b0b0b;
      border: 1px solid #272727;
      border-radius: 10px;
      padding: 9px 11px;
      color: #aaa;
      font-size: 13px;
    }

    /* =========================
       AUTH MODAL
    ========================= */

    .auth-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.86);
      backdrop-filter: blur(5px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-overlay.show {
      display: flex;
    }

    .auth-box {
      width: 100%;
      max-width: 390px;
      background: #080808;
      border: 1px solid #292929;
      border-radius: 17px;
      padding: 25px;
      box-shadow: 0 20px 80px rgba(0,0,0,.85);
      position: relative;
    }

    .auth-close {
      position: absolute;
      top: 12px;
      right: 14px;
      border: none;
      background: transparent;
      color: #888;
      font-size: 22px;
      cursor: pointer;
    }

    .auth-close:hover {
      color: white;
    }

    .auth-box h2 {
      margin-bottom: 7px;
      font-size: 24px;
      color: #f5f5f5;
    }

    .auth-subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .auth-input {
      width: 100%;
      padding: 13px;
      margin-bottom: 11px;
      border: 1px solid #292929;
      border-radius: 9px;
      background: #101010;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .auth-input:focus {
      border-color: #444;
      background: #121212;
    }

    .auth-submit {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 13px;
      background: #f5f5f5;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .auth-submit:hover {
      background: white;
    }

    .auth-submit:disabled {
      opacity: .5;
      cursor: default;
    }

    .auth-switch {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-top: 16px;
    }

    .auth-switch button {
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
      text-decoration: underline;
    }

    .auth-message {
      display: none;
      margin-bottom: 12px;
      padding: 9px;
      border-radius: 8px;
      background: #201010;
      color: #ffb4b4;
      font-size: 13px;
      line-height: 1.4;
    }

    .auth-message.show {
      display: block;
    }

    .logout-button {
      display: none;
    }

    .overlay {
      display: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        bottom: 0;
        transition: left .25s ease;
      }

      .sidebar.open {
        left: 0;
      }

      .overlay.show {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.7);
        z-index: 15;
      }

      .menu-button {
        display: block;
      }

      .topbar {
        padding: 0 14px;
      }

      .top-right .top-button {
        display: none;
      }

      .input-wrapper {
        left: 0;
        padding: 12px;
      }

      .chat-area {
        padding-left: 12px;
        padding-right: 12px;
      }

      .welcome h1 {
        font-size: 29px;
      }

      .welcome p {
        font-size: 16px;
      }

      .model-badge {
        display: none;
      }

      .message {
        gap: 9px;
        margin: 22px 0;
        font-size: 16px;
      }

      .message-avatar {
        width: 33px;
        height: 33px;
      }

      .message.user .message-content {
        max-width: 80%;
        padding: 11px 14px;
      }

      .message.bot .message-content {
        max-width: 82%;
      }

      textarea {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div
      class="overlay"
      id="overlay"
      onclick="toggleSidebar()"
    ></div>

    <!-- AUTH MODAL -->

    <div class="auth-overlay" id="authOverlay">

      <div class="auth-box">

        <button
          class="auth-close"
          onclick="closeAuth()"
        >
          ×
        </button>

        <h2 id="authTitle">Log in</h2>

        <div
          class="auth-subtitle"
          id="authSubtitle"
        >
          Log in to your Chatabot account.
        </div>

        <div
          class="auth-message"
          id="authMessage"
        ></div>

        <input
          class="auth-input"
          id="authName"
          type="text"
          placeholder="Full name"
          style="display:none;"
        >

        <input
          class="auth-input"
          id="authEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          class="auth-input"
          id="authPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button
          class="auth-submit"
          id="authSubmit"
          onclick="submitAuth()"
        >
          Log in
        </button>

        <div class="auth-switch">

          <span id="authSwitchText">
            Don't have an account?
          </span>

          <button
            onclick="switchAuthMode()"
            id="authSwitchButton"
          >
            Sign up
          </button>

        </div>

      </div>

    </div>

    <!-- SIDEBAR -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="brand">

        <img
          class="brand-icon"
          src="https://i.ibb.co/C36d4GVm/Chat-GPT-Image-Sep-16-2026-08-48-19-PM.png"
          alt="Chatabot"
        >

        <span>Chatabot</span>

      </div>

      <button
        class="new-chat"
        onclick="newChat()"
      >
        ＋ New chat
      </button>

      <div class="history-title">
        Recent chats
      </div>

      <div
        class="history"
        id="history"
      >
        <div class="empty-history">
          No chats yet
        </div>
      </div>

      <div class="profile">

        <div
          class="avatar"
          id="profileAvatar"
        >
          U
        </div>

        <div class="profile-info">

          <div
            class="profile-name"
            id="profileName"
          >
            Guest
          </div>

          <div
            class="profile-plan"
            id="profilePlan"
          >
            Free plan
          </div>

        </div>

        <button
          class="profile-button"
          onclick="profileAction()"
        >
          ⋯
        </button>

      </div>

    </aside>

    <!-- MAIN -->

    <main class="main">

      <header class="topbar">

        <div class="top-left">

          <button
            class="menu-button"
            onclick="toggleSidebar()"
          >
            ☰
          </button>

          <div class="model-name">
            Chatabot
          </div>

          <div class="model-badge">
            AI
          </div>

        </div>

        <div class="top-right">

          <button
            class="top-button"
            id="loginButton"
            onclick="loginPrompt()"
          >
            Log in
          </button>

          <button
            class="top-button"
            id="signupButton"
            onclick="signupPrompt()"
          >
            Sign up
          </button>

          <button
            class="logout-button"
            id="logoutButton"
            onclick="logoutUser()"
          >
            Log out
          </button>

        </div>

      </header>

      <section
        class="chat-area"
        id="chatArea"
      >

        <div
          class="messages"
          id="messages"
        >

          <div
            class="welcome"
            id="welcome"
          >

            <img
              class="welcome-logo"
              src="https://i.ibb.co/C36d4GVm/Chat-GPT-Image-Sep-16-2026-08-48-19-PM.png"
              alt="Chatabot"
            >

            <h1>
              How can I help you?
            </h1>

            <p>
              Ask Chatabot anything.
            </p>

          </div>

        </div>

      </section>

      <!-- INPUT -->

      <div class="input-wrapper">

        <div
          class="upload-preview"
          id="uploadPreview"
        ></div>

        <div class="input-box">

          <input
            type="file"
            id="fileInput"
            accept="image/*"
            onchange="handleImageUpload(event)"
          >

          <button
            class="attach-button"
            onclick="document.getElementById('fileInput').click()"
            title="Upload image"
          >
            ＋
          </button>

          <textarea
            id="userInput"
            placeholder="Message Chatabot..."
            rows="1"
            oninput="resizeTextarea()"
            onkeydown="handleKey(event)"
          ></textarea>

          <button
            class="send-button"
            id="sendButton"
            onclick="sendMessage()"
            title="Send"
          >
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M12 19V5"></path>
              <path d="M6 11l6-6 6 6"></path>
            </svg>
          </button>

        </div>

        <div class="disclaimer">
          Chatabot can make mistakes. Check important information.
        </div>

      </div>

    </main>

  </div>

  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://djdiurxlkyycbodqmwpf.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Y9sfWTMFJTusWTg7WlKy6g_J9btundB";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       AI BACKEND
    ========================= */

    const AI_API_URL =
      "/api/chat";

    const IMAGE_API_URL =
      "/api/image";


    /* =========================
       ELEMENTS
    ========================= */

    const input =
      document.getElementById("userInput");

    const messages =
      document.getElementById("messages");

    const history =
      document.getElementById("history");

    const chatArea =
      document.getElementById("chatArea");

    const uploadPreview =
      document.getElementById("uploadPreview");

    const sendButton =
      document.getElementById("sendButton");

    const authOverlay =
      document.getElementById("authOverlay");

    const authTitle =
      document.getElementById("authTitle");

    const authSubtitle =
      document.getElementById("authSubtitle");

    const authName =
      document.getElementById("authName");

    const authEmail =
      document.getElementById("authEmail");

    const authPassword =
      document.getElementById("authPassword");

    const authSubmit =
      document.getElementById("authSubmit");

    const authMessage =
      document.getElementById("authMessage");

    const authSwitchText =
      document.getElementById("authSwitchText");

    const authSwitchButton =
      document.getElementById("authSwitchButton");

    const profileName =
      document.getElementById("profileName");

    const profilePlan =
      document.getElementById("profilePlan");

    const profileAvatar =
      document.getElementById("profileAvatar");

    const loginButton =
      document.getElementById("loginButton");

    const signupButton =
      document.getElementById("signupButton");

    const logoutButton =
      document.getElementById("logoutButton");


    /* =========================
       CHAT DATA
    ========================= */

    let currentChat = [];

    let chats =
      JSON.parse(
        localStorage.getItem(
          "chatabot_history"
        ) || "[]"
      );

    let selectedChat = null;

    let aiBusy = false;

    let selectedImageFile = null;


    /* =========================
       AUTH DATA
    ========================= */

    let authMode = "login";

    let currentUser = null;


    renderHistory();

    checkAuth();


    /* =========================
       AUTH CHECK
    ========================= */

    async function checkAuth() {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();

      if (
        session &&
        session.user
      ) {

        currentUser =
          session.user;

        await loadUserProfile();

      } else {

        currentUser = null;

        updateGuestUI();

      }

    }


    /* =========================
       AUTH STATE LISTENER
    ========================= */

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (
          session &&
          session.user
        ) {

          currentUser =
            session.user;

          await loadUserProfile();

        } else {

          currentUser = null;

          updateGuestUI();

        }

      }
    );


    /* =========================
       LOAD PROFILE
    ========================= */

    async function loadUserProfile() {

      if (!currentUser) return;

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "user_id",
            currentUser.id
          )
          .maybeSingle();

      if (error) {

        console.error(
          "Profile load error:",
          error
        );

        updateUserUI(
          currentUser.user_metadata?.full_name ||
          currentUser.email ||
          "User",
          "Free plan"
        );

        return;

      }

      if (data) {

        updateUserUI(
          data.full_name ||
          currentUser.email ||
          "User",
          data.plan || "free"
        );

      } else {

        await createUserProfile();

      }

    }


    /* =========================
       CREATE PROFILE
    ========================= */

    async function createUserProfile() {

      if (!currentUser) return;

      const fullName =
        currentUser.user_metadata?.full_name ||
        currentUser.email?.split("@")[0] ||
        "User";

      const {
        error
      } =
        await supabaseClient
          .from("profiles")
          .insert({
            user_id: currentUser.id,
            email: currentUser.email,
            full_name: fullName,
            plan: "free"
          });

      if (error) {

        console.error(
          "Profile creation error:",
          error
        );

        updateUserUI(
          fullName,
          "Free plan"
        );

        return;

      }

      updateUserUI(
        fullName,
        "Free plan"
      );

    }


    /* =========================
       UPDATE USER UI
    ========================= */

    function updateUserUI(
      name,
      plan
    ) {

      profileName.textContent =
        name;

      profilePlan.textContent =
        plan === "free"
          ? "Free plan"
          : plan;

      profileAvatar.textContent =
        name
          .charAt(0)
          .toUpperCase();

      loginButton.style.display =
        "none";

      signupButton.style.display =
        "none";

      logoutButton.style.display =
        "block";

    }


    /* =========================
       GUEST UI
    ========================= */

    function updateGuestUI() {

      profileName.textContent =
        "Guest";

      profilePlan.textContent =
        "Free plan";

      profileAvatar.textContent =
        "U";

      loginButton.style.display =
        "block";

      signupButton.style.display =
        "block";

      logoutButton.style.display =
        "none";

    }


    /* =========================
       LOGIN
    ========================= */

    function loginPrompt() {

      authMode = "login";

      authTitle.textContent =
        "Log in";

      authSubtitle.textContent =
        "Log in to your Chatabot account.";

      authName.style.display =
        "none";

      authSubmit.textContent =
        "Log in";

      authSwitchText.textContent =
        "Don't have an account?";

      authSwitchButton.textContent =
        "Sign up";

      clearAuthMessage();

      authEmail.value = "";

      authPassword.value = "";

      authOverlay.classList.add(
        "show"
      );

    }


    /* =========================
       SIGNUP
    ========================= */

    function signupPrompt() {

      authMode = "signup";

      authTitle.textContent =
        "Create account";

      authSubtitle.textContent =
        "Create your free Chatabot account.";

      authName.style.display =
        "block";

      authSubmit.textContent =
        "Sign up";

      authSwitchText.textContent =
        "Already have an account?";

      authSwitchButton.textContent =
        "Log in";

      clearAuthMessage();

      authName.value = "";

      authEmail.value = "";

      authPassword.value = "";

      authOverlay.classList.add(
        "show"
      );

    }


    /* =========================
       SWITCH AUTH
    ========================= */

    function switchAuthMode() {

      if (
        authMode === "login"
      ) {

        signupPrompt();

      } else {

        loginPrompt();

      }

    }


    /* =========================
       CLOSE AUTH
    ========================= */

    function closeAuth() {

      authOverlay.classList.remove(
        "show"
      );

      clearAuthMessage();

    }


    /* =========================
       AUTH MESSAGE
    ========================= */

    function showAuthMessage(
      message
    ) {

      authMessage.textContent =
        message;

      authMessage.classList.add(
        "show"
      );

    }


    function clearAuthMessage() {

      authMessage.textContent =
        "";

      authMessage.classList.remove(
        "show"
      );

    }


    /* =========================
       SUBMIT AUTH
    ========================= */

    async function submitAuth() {

      clearAuthMessage();

      const email =
        authEmail.value.trim();

      const password =
        authPassword.value;

      if (
        !email ||
        !password
      ) {

        showAuthMessage(
          "Please enter your email and password."
        );

        return;

      }

      if (
        authMode === "signup"
      ) {

        const fullName =
          authName.value.trim();

        if (!fullName) {

          showAuthMessage(
            "Please enter your full name."
          );

          return;

        }

        if (
          password.length < 6
        ) {

          showAuthMessage(
            "Password must be at least 6 characters."
          );

          return;

        }

        authSubmit.disabled =
          true;

        authSubmit.textContent =
          "Creating...";

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                full_name:
                  fullName
              }
            }

          });

        authSubmit.disabled =
          false;

        authSubmit.textContent =
          "Sign up";

        if (error) {

          showAuthMessage(
            error.message
          );

          return;

        }

        if (
          data.user &&
          !data.session
        ) {

          showAuthMessage(
            "Account created. Please check your email to confirm your account."
          );

          return;

        }

        if (data.session) {

          currentUser =
            data.user;

          await createUserProfile();

          closeAuth();

        }

        return;

      }


      /* LOGIN */

      authSubmit.disabled =
        true;

      authSubmit.textContent =
        "Logging in...";

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });

      authSubmit.disabled =
        false;

      authSubmit.textContent =
        "Log in";

      if (error) {

        showAuthMessage(
          error.message
        );

        return;

      }

      if (data.user) {

        currentUser =
          data.user;

        await loadUserProfile();

        closeAuth();

      }

    }


    /* =========================
       LOGOUT
    ========================= */

    async function logoutUser() {

      const {
        error
      } =
        await supabaseClient.auth.signOut();

      if (error) {

        alert(error.message);

        return;

      }

      currentUser = null;

      updateGuestUI();

    }


    /* =========================
       PROFILE BUTTON
    ========================= */

    function profileAction() {

      if (currentUser) {

        logoutUser();

      } else {

        loginPrompt();

      }

    }


    /* =========================
       IMAGE REQUEST DETECTION
    ========================= */

    function isImageRequest(text) {

      const lower =
        text.toLowerCase();

      const imageWords = [
        "generate image",
        "generate an image",
        "create image",
        "create an image",
        "make an image",
        "make me an image",
        "draw an image",
        "generate a picture",
        "create a picture",
        "make a picture",
        "draw",
        "image of",
        "picture of"
      ];

      return imageWords.some(
        word =>
          lower.includes(word)
      );

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      if (aiBusy) return;

      const text =
        input.value.trim();

      if (!text) return;

      removeWelcome();

      addMessage(
        text,
        "user"
      );

      currentChat.push({
        role: "user",
        content: text
      });

      input.value = "";

      resizeTextarea();

      saveCurrentChat();

      aiBusy = true;

      sendButton.disabled =
        true;

      const typingMessage =
        addTypingMessage();

      try {

        /* IMAGE GENERATION */

        if (
          isImageRequest(text)
        ) {

          const prompt =
            cleanImagePrompt(text);

          const response =
            await fetch(
              IMAGE_API_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  prompt: prompt
                })
              }
            );

          let data = null;

          try {

            data =
              await response.json();

          } catch (e) {

            data = null;

          }

          if (!response.ok) {

            throw new Error(
              data?.details ||
              data?.error ||
              "Image generation failed."
            );

          }

          if (!data?.image) {

            throw new Error(
              "The AI did not return an image."
            );

          }

          typingMessage.remove();

          addImageMessage(
            data.image,
            prompt
          );

          currentChat.push({
            role: "bot",
            content: "[Generated image]\n" + prompt,
            image: data.image
          });

          saveCurrentChat();

          return;

        }


        /* NORMAL CHAT */

        const response =
          await fetch(
            AI_API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                messages:
                  currentChat.map(
                    message => ({
                      role:
                        message.role ===
                        "bot"
                          ? "assistant"
                          : message.role,
                      content:
                        message.content
                    })
                  )
              })
            }
          );

        let data = null;

        try {

          data =
            await response.json();

        } catch (e) {

          data = null;

        }

        if (!response.ok) {

          throw new Error(
            data?.details ||
            data?.error ||
            "AI request failed."
          );

        }

        const reply =
          data?.response ||
          data?.result?.response ||
          data?.text ||
          data?.result ||
          "Sorry, I couldn't generate a response.";

        typingMessage.remove();

        addMessage(
          String(reply),
          "bot"
        );

        currentChat.push({
          role: "bot",
          content: String(reply)
        });

        saveCurrentChat();

      } catch (error) {

        console.error(
          "AI error:",
          error
        );

        typingMessage.remove();

        const errorReply =
          "Sorry, I couldn't connect to the AI right now. Please try again.";

        addMessage(
          errorReply,
          "bot"
        );

      } finally {

        aiBusy = false;

        sendButton.disabled =
          false;

        input.focus();

      }

    }


    /* =========================
       IMAGE PROMPT CLEANER
    ========================= */

    function cleanImagePrompt(
      text
    ) {

      let prompt =
        text.trim();

      const replacements = [
        /^can you\s+/i,
        /^could you\s+/i,
        /^please\s+/i,
        /^generate\s+(an?\s+)?image\s+(of\s+)?/i,
        /^create\s+(an?\s+)?image\s+(of\s+)?/i,
        /^make\s+(me\s+)?(an?\s+)?image\s+(of\s+)?/i,
        /^draw\s+(an?\s+)?image\s+(of\s+)?/i
      ];

      replacements.forEach(
        regex => {
          prompt =
            prompt.replace(
              regex,
              ""
            );
        }
      );

      return (
        prompt.trim() ||
        "A beautiful creative digital artwork"
      );

    }


    /* =========================
       ADD TEXT MESSAGE
    ========================= */

    function addMessage(
      text,
      type
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message " +
        (
          type === "user"
            ? "user"
            : "bot"
        );

      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "message-avatar " +
        (
          type === "user"
            ? "user-avatar"
            : "bot-avatar"
        );

      if (
        type === "user"
      ) {

        avatar.textContent =
          currentUser?.user_metadata?.full_name
            ?.charAt(0)
            ?.toUpperCase() ||
          "U";

      } else {

        const img =
          document.createElement(
            "img"
          );

        img.src =
          "https://i.ibb.co/C36d4GVm/Chat-GPT-Image-Sep-16-2026-08-48-19-PM.png";

        img.alt =
          "Chatabot";

        avatar.appendChild(
          img
        );

      }

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "message-content";

      content.textContent =
        text;

      message.appendChild(
        avatar
      );

      message.appendChild(
        content
      );

      messages.appendChild(
        message
      );

      chatArea.scrollTop =
        chatArea.scrollHeight;

      return message;

    }


    /* =========================
       ADD IMAGE MESSAGE
    ========================= */

    function addImageMessage(
      imageData,
      prompt
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message bot";

      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "message-avatar bot-avatar";

      const avatarImg =
        document.createElement(
          "img"
        );

      avatarImg.src =
        "https://i.ibb.co/C36d4GVm/Chat-GPT-Image-Sep-16-2026-08-48-19-PM.png";

      avatarImg.alt =
        "Chatabot";

      avatar.appendChild(
        avatarImg
      );

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "message-content";

      const label =
        document.createElement(
          "div"
        );

      label.className =
        "image-label";

      label.textContent =
        "Generated image";

      const image =
        document.createElement(
          "img"
        );

      image.className =
        "generated-image";

      image.src =
        imageData.startsWith("data:")
          ? imageData
          : "data:image/jpeg;base64," +
            imageData;

      image.alt =
        prompt || "Generated image";

      content.appendChild(
        label
      );

      content.appendChild(
        image
      );

      message.appendChild(
        avatar
      );

      message.appendChild(
        content
      );

      messages.appendChild(
        message
      );

      chatArea.scrollTop =
        chatArea.scrollHeight;

      return message;

    }


    /* =========================
       TYPING
    ========================= */

    function addTypingMessage() {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message bot";

      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "message-avatar bot-avatar";

      const img =
        document.createElement(
          "img"
        );

      img.src =
        "https://i.ibb.co/C36d4GVm/Chat-GPT-Image-Sep-16-2026-08-48-19-PM.png";

      img.alt =
        "Chatabot";

      avatar.appendChild(
        img
      );

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "message-content";

      content.innerHTML = `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;

      message.appendChild(
        avatar
      );

      message.appendChild(
        content
      );

      messages.appendChild(
        message
      );

      chatArea.scrollTop =
        chatArea.scrollHeight;

      return message;

    }


    /* =========================
       NEW CHAT
    ========================= */

    function newChat() {

      if (
        currentChat.length > 0
      ) {

        saveCurrentChat();

      }

      currentChat = [];

      selectedChat = null;

      showWelcome();

      input.value = "";

      resizeTextarea();

      uploadPreview.style.display =
        "none";

      uploadPreview.textContent =
        "";

      selectedImageFile =
        null;

      document.getElementById(
        "fileInput"
      ).value = "";

      closeMobileSidebar();

      renderHistory();

    }


    /* =========================
       SAVE CHAT
    ========================= */

    function saveCurrentChat() {

      if (
        !currentChat.length
      ) return;

      const firstUserMessage =
        currentChat.find(
          m =>
            m.role === "user"
        );

      const title =
        firstUserMessage
          ? firstUserMessage.content.substring(
              0,
              45
            )
          : "New chat";

      if (
        selectedChat !== null
      ) {

        const oldChat =
          chats[selectedChat] || {};

        chats[selectedChat] = {
          title: title,
          messages:
            currentChat,
          pinned:
            oldChat.pinned || false
        };

      } else {

        chats.unshift({
          title: title,
          messages:
            currentChat,
          pinned: false
        });

        selectedChat = 0;

      }

      localStorage.setItem(
        "chatabot_history",
        JSON.stringify(chats)
      );

      renderHistory();

    }


    /* =========================
       HISTORY
    ========================= */

    function renderHistory() {

      history.innerHTML =
        "";

      if (!chats.length) {

        history.innerHTML =
          '<div class="empty-history">No chats yet</div>';

        return;

      }

      chats.forEach(
        (chat, index) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "history-item " +
            (
              index === selectedChat
                ? "active"
                : ""
            );

          item.textContent =
            chat.title ||
            "New chat";

          item.onclick =
            () =>
              loadChat(index);

          history.appendChild(
            item
          );

        }
      );

    }


    /* =========================
       LOAD CHAT
    ========================= */

    function loadChat(index) {

      const chat =
        chats[index];

      if (!chat) return;

      selectedChat =
        index;

      currentChat =
        [...chat.messages];

      messages.innerHTML =
        "";

      currentChat.forEach(
        message => {

          if (
            message.image
          ) {

            addImageMessage(
              message.image,
              message.content
                ?.replace(
                  "[Generated image]\n",
                  ""
                )
            );

          } else {

            addMessage(
              message.content,
              message.role === "user"
                ? "user"
                : "bot"
            );

          }

        }
      );

      renderHistory();

      closeMobileSidebar();

    }


    /* =========================
       WELCOME
    ========================= */

    function removeWelcome() {

      const welcome =
        document.getElementById(
          "welcome"
        );

      if (welcome) {
        welcome.remove();
      }

    }


    function showWelcome() {

      messages.innerHTML =
        "";

      const welcome =
        document.createElement(
          "div"
        );

      welcome.className =
        "welcome";

      welcome.id =
        "welcome";

      welcome.innerHTML = `
        <img
          class="welcome-logo"
          src="https://i.ibb.co/C36d4GVm/Chat-GPT-Image-Sep-16-2026-08-48-19-PM.png"
          alt="Chatabot"
        >
        <h1>How can I help you?</h1>
        <p>Ask Chatabot anything.</p>
      `;

      messages.appendChild(
        welcome
      );

    }


    /* =========================
       ENTER TO SEND
    ========================= */

    function handleKey(
      event
    ) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =========================
       TEXTAREA RESIZE
    ========================= */

    function resizeTextarea() {

      input.style.height =
        "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          150
        ) + "px";

    }


    /* =========================
       IMAGE UPLOAD UI
    ========================= */

    function handleImageUpload(
      event
    ) {

      const file =
        event.target.files[0];

      if (!file) return;

      selectedImageFile =
        file;

      uploadPreview.style.display =
        "block";

      uploadPreview.textContent =
        "📎 " +
        file.name +
        " selected";

    }


    /* =========================
       MOBILE SIDEBAR
    ========================= */

    function toggleSidebar() {

      document
        .getElementById(
          "sidebar"
        )
        .classList.toggle(
          "open"
        );

      document
        .getElementById(
          "overlay"
        )
        .classList.toggle(
          "show"
        );

    }


    function closeMobileSidebar() {

      document
        .getElementById(
          "sidebar"
        )
        .classList.remove(
          "open"
        );

      document
        .getElementById(
          "overlay"
        )
        .classList.remove(
          "show"
        );

    }

  </script>

</body>
</html>
